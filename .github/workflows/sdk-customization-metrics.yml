name: SDK customization metrics

on:
  pull_request:
    paths:
      - eng/scripts/sdk-customization-metrics/**
      - .github/workflows/sdk-customization-metrics.yml
      - .github/workflows/sdk-customization-metrics-pages.yml
  push:
    branches: [main]
    paths:
      - eng/scripts/sdk-customization-metrics/**
      - .github/workflows/sdk-customization-metrics.yml
      - .github/workflows/sdk-customization-metrics-pages.yml
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:
    inputs:
      analyze:
        description: Run explicitly configured analyst and independent reviewer (requires AI enablement)
        type: boolean
        default: false
      reviews_only:
        description: Only apply human reviews from the hosted site (skip discovery and scanning)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-customization-metrics-${{ github.event_name == 'pull_request' && github.ref || 'collector' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Type-check (TypeScript version matches the repository)
        run: |
          npm install --prefix "$RUNNER_TEMP/tsc" --no-save --no-package-lock \
            typescript@7.0.2 @types/node@26
          ln -sfn "$RUNNER_TEMP/tsc/node_modules" \
            eng/scripts/sdk-customization-metrics/node_modules
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" -p eng/scripts/sdk-customization-metrics/tsconfig.json
      - run: node --test eng/scripts/sdk-customization-metrics/test/*.test.ts
      - name: Type-check and bundle the hosted review server
        working-directory: eng/scripts/sdk-customization-metrics/azure
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

  collect:
    needs: test
    # Off until the repository variable SDK_METRICS_ENABLED is "true". AI review additionally
    # needs SDK_METRICS_AI_ENABLED and SDK_METRICS_AI_CONFIG_JSON (see README).
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'push' &&
      vars.SDK_METRICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
      # GitHub Models uses the workflow token; harmless when another provider is configured.
      models: read
    env:
      TOOL: eng/scripts/sdk-customization-metrics
    steps:
      - name: Checkout the dashboard branch (code, inventory and scan history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Cache SDK repository clones (blob-less, so small)
        if: ${{ !inputs.reviews_only }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/sdk-repos
          key: sdk-repos-${{ github.run_id }}
          restore-keys: sdk-repos-
      - name: Discover TypeSpec libraries (new, removed and changed)
        if: ${{ !inputs.reviews_only }}
        run: node "$TOOL/cli.ts" discover --repos-dir "$RUNNER_TEMP/sdk-repos"
      - name: Scan libraries whose folder changed
        id: collect
        if: ${{ !inputs.reviews_only }}
        continue-on-error: true
        run: |
          node "$TOOL/cli.ts" collect --state "$TOOL/state" --from-inventory --plane data \
            --reader git --skip-unchanged --repos-dir "$RUNNER_TEMP/sdk-repos"
      - name: AI-review new and changed libraries (only when enabled)
        id: review
        if: vars.SDK_METRICS_AI_ENABLED == 'true' && !inputs.reviews_only
        continue-on-error: true
        env:
          AI_CONFIG: ${{ vars.SDK_METRICS_AI_CONFIG_JSON }}
          # GitHub Models accepts the workflow token; other providers use a secret.
          METRICS_AI_TOKEN: ${{ secrets.SDK_METRICS_AI_TOKEN || github.token }}
        run: |
          printf '%s' "$AI_CONFIG" > "$RUNNER_TEMP/metrics-ai.json"
          node "$TOOL/cli.ts" review --state "$TOOL/state" --plane data \
            --ai-config "$RUNNER_TEMP/metrics-ai.json"
      - name: Apply human reviews submitted on the hosted site (only when configured)
        id: reviews
        if: vars.SDK_METRICS_REVIEW_SITE != ''
        continue-on-error: true
        env:
          REVIEW_SITE: ${{ vars.SDK_METRICS_REVIEW_SITE }}
        run: |
          node "$TOOL/cli.ts" apply-reviews --state "$TOOL/state" \
            --reviews "${REVIEW_SITE%/}/api/reviews"
      - name: Validate
        run: node "$TOOL/cli.ts" validate --state "$TOOL/state"
      - name: Commit inventory and append-only scan history
        run: |
          git add -- "$TOOL/inventory" "$TOOL/state/records"
          if [ -d "$TOOL/state/overrides" ]; then git add -- "$TOOL/state/overrides"; fi
          if [ -f "$TOOL/state/review-log.json" ]; then git add -- "$TOOL/state/review-log.json"; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "SDK customization metrics update ${GITHUB_RUN_ID}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Republish the dashboard
        # Pushes made with the workflow token do not trigger workflows, so dispatch Pages.
        if: hashFiles('.github/workflows/sdk-customization-metrics-pages.yml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sdk-customization-metrics-pages.yml --ref "$GITHUB_REF_NAME"
      - name: Redeploy the hosted review site (only when enabled)
        if: vars.SDK_METRICS_AZURE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sdk-customization-metrics-azure.yml --ref "$GITHUB_REF_NAME"
      - name: Report scan or review failures after preserving results
        if: >-
          steps.collect.outcome == 'failure' || steps.review.outcome == 'failure' ||
          steps.reviews.outcome == 'failure'
        run: |
          echo "::error::Some scans or reviews failed; results that succeeded were committed"
          exit 1
