name: SDK customization metrics

on:
  pull_request:
    paths:
      - eng/scripts/sdk-customization-metrics/**
      - .github/workflows/sdk-customization-metrics.yml
      - .github/workflows/sdk-customization-metrics-pages.yml
  push:
    branches: [main]
    paths:
      - eng/scripts/sdk-customization-metrics/**
      - .github/workflows/sdk-customization-metrics.yml
      - .github/workflows/sdk-customization-metrics-pages.yml
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:
    inputs:
      analyze:
        description: Run explicitly configured analyst and independent reviewer (requires AI enablement)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-customization-metrics-${{ github.event_name == 'pull_request' && github.ref || 'collector' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: node --test eng/scripts/sdk-customization-metrics/test/*.test.mjs

  collect:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'push' &&
      vars.SDK_METRICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TOOL: collector/eng/scripts/sdk-customization-metrics
      STATE: data/eng/scripts/sdk-customization-metrics/state
    steps:
      - name: Checkout trusted collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: collector
          persist-credentials: false
      - name: Checkout versioned records and override history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sdk-customization-metrics-data
          path: data
          sparse-checkout: eng/scripts/sdk-customization-metrics/state
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Configure approved analysis only when enabled
        env:
          REQUESTED: ${{ github.event_name == 'schedule' || inputs.analyze }}
          ENABLED: ${{ vars.SDK_METRICS_AI_ENABLED }}
          AI_CONFIG: ${{ vars.SDK_METRICS_AI_CONFIG_JSON }}
        run: |
          if [ "$REQUESTED" = "true" ] && [ "$ENABLED" = "true" ]; then
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              import { join } from "node:path";
              const config = JSON.parse(process.env.AI_CONFIG);
              writeFileSync(join(process.env.RUNNER_TEMP, "metrics-ai.json"), JSON.stringify(config));
            '
            echo "METRICS_ANALYZE=true" >> "$GITHUB_ENV"
          elif [ "$REQUESTED" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Analysis requested but SDK_METRICS_AI_ENABLED is not true"
            exit 1
          fi
      - name: Extract public sources and optionally analyze
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          METRICS_AI_TOKEN: ${{ secrets.SDK_METRICS_AI_TOKEN }}
        run: |
          if [ "${METRICS_ANALYZE:-false}" = "true" ]; then
            node "$TOOL/cli.mjs" collect --state "$STATE" --analyze --ai-config "$RUNNER_TEMP/metrics-ai.json"
          else
            node "$TOOL/cli.mjs" collect --state "$STATE"
          fi
      - name: Validate and export including explicit failures
        run: |
          node "$TOOL/cli.mjs" validate --state "$STATE"
          node "$TOOL/cli.mjs" export --state "$STATE" --out "$RUNNER_TEMP/sdk-metrics-site"
      - name: Persist append-only public scan history
        working-directory: data
        run: |
          git add -- eng/scripts/sdk-customization-metrics/state/records
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record SDK customization scan ${GITHUB_RUN_ID}"
            git push origin HEAD:refs/heads/sdk-customization-metrics-data
          fi
      - name: Upload Pages-suitable static site (no deployment)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-customization-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/sdk-metrics-site
          retention-days: 30
      - name: Report collection or analysis failure after preserving evidence
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more scans or analyses failed; see versioned records and dashboard coverage"
          exit 1
