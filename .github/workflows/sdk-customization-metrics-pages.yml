name: Publish SDK customization metrics on personal fork

on:
  push:
    branches: [sdk-customization-metrics]
    paths:
      - eng/scripts/sdk-customization-metrics/**
      - .github/workflows/sdk-customization-metrics-pages.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'iscai-msft/typespec-azure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Test extraction, review states, overrides, queries, and publication
        run: node --test eng/scripts/sdk-customization-metrics/test/*.test.mjs
      - name: Collect only public starter evidence without AI or legacy imports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp -R eng/scripts/sdk-customization-metrics/state "$RUNNER_TEMP/sdk-metrics-history"
          node eng/scripts/sdk-customization-metrics/cli.mjs collect \
            --state eng/scripts/sdk-customization-metrics/state
      - name: Assemble fork landing page and isolated dashboard route
        run: |
          mkdir "$RUNNER_TEMP/sdk-metrics-site"
          cp eng/scripts/sdk-customization-metrics/web/fork-index.html \
            "$RUNNER_TEMP/sdk-metrics-site/index.html"
          node eng/scripts/sdk-customization-metrics/cli.mjs publish \
            --state eng/scripts/sdk-customization-metrics/state \
            --history-state "$RUNNER_TEMP/sdk-metrics-history" \
            --out "$RUNNER_TEMP/sdk-metrics-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/sdk-metrics-site

  deploy:
    if: github.repository == 'iscai-msft/typespec-azure'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only to the personal fork Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
